[Service]
ExecStartPre=/bin/sh -c 'for p in /sys/bus/platform/devices/4a88000.serial/power/control /sys/bus/platform/devices/4a88000.serial/4a88000.serial:0/power/control /sys/bus/platform/devices/4a88000.serial/4a88000.serial:0/4a88000.serial:0.0/power/control; do echo on > "$p" || exit 1; done'
ExecStart=
ExecStart=/usr/bin/arduino-router --unix-port /var/run/arduino-router.sock --serial-port /dev/ttyHS1 --serial-baudrate 921600
ExecStartPost=/bin/sh -c 'sleep 1; stty -F /dev/ttyHS1 crtscts'

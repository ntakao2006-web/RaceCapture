# EcoLogger V2 (ER-10-4): PipeWire only handles the Bluetooth headset; USB audio is
# opened directly by ecocapture-voice. Nobody sits at a seat on the logger, so the
# default "Bluetooth only for the active local session" rule must be off.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    monitor.alsa = disabled
  }
}

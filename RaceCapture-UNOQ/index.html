<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RaceCapture / LoggerV2</title>
  <style>
    :root{color-scheme:dark;--bg:#101419;--panel:#171d24;--line:#33404d;--text:#e9edf2;--muted:#9ba9b6;--accent:#42b7e9}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
    body{display:flex;flex-direction:column;overflow:hidden}header{min-height:48px;display:flex;align-items:center;gap:8px;padding:5px 10px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line)}
    .brand{margin-right:auto;white-space:nowrap}.brand strong{display:block}.brand span{font-size:11px;color:var(--muted)}
    button{min-height:34px;padding:5px 12px;color:var(--text);background:#242e39;border:1px solid #465565;border-radius:6px;font:inherit;cursor:pointer}
    button:hover{border-color:#7390a8}button.active{color:#07131a;background:var(--accent);border-color:var(--accent);font-weight:700}
    #page-nav{display:flex;gap:5px}.panel{flex:1;min-height:0}.panel[hidden]{display:none!important}#race-panel{display:flex}#screen{flex:1;min-width:0;min-height:0}
    #eco-frame{width:100%;height:100%;border:0;background:#fff}#state{font-size:11px;color:var(--muted)}
    @media(max-width:760px){header{flex-wrap:wrap}.brand{width:100%}.brand strong,.brand span{display:inline}.brand span{margin-left:8px}button{flex:1;padding:4px 8px}.panel{min-height:0}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><strong>LoggerV2</strong><span id="state">RaceCapture接続中…</span></div>
    <button id="race-tab" class="active" type="button">RaceCapture</button>
    <button id="eco-tab" type="button">EcoCapture</button>
    <span id="page-nav">
      <button id="previous-page" type="button" title="RaceCaptureの前のDashboard画面">‹ 前</button>
      <button id="next-page" type="button" title="RaceCaptureの次のDashboard画面">次 ›</button>
    </span>
    <button id="logs" type="button">ログ・SD</button>
    <button id="settings" type="button">設定</button>
    <button id="fullscreen" type="button">全画面</button>
  </header>
  <main id="race-panel" class="panel"><div id="screen"></div></main>
  <main id="eco-panel" class="panel" hidden><iframe id="eco-frame" title="EcoCapture" loading="eager"></iframe></main>
  <script type="module">
    import RFB from './core/rfb.js';
    const screen=document.querySelector('#screen'),state=document.querySelector('#state');
    const racePanel=document.querySelector('#race-panel'),ecoPanel=document.querySelector('#eco-panel');
    const raceTab=document.querySelector('#race-tab'),ecoTab=document.querySelector('#eco-tab');
    const pageNav=document.querySelector('#page-nav'),ecoFrame=document.querySelector('#eco-frame');
    const ecoBase=`${location.protocol}//${location.hostname}:8080/`;
    let rfb;
    function connect(){
      rfb=new RFB(screen,`${location.protocol==='https:'?'wss':'ws'}://${location.host}/websockify`);
      rfb.scaleViewport=true;rfb.resizeSession=false;
      rfb.addEventListener('connect',()=>state.textContent='RaceCapture接続済み');
      rfb.addEventListener('disconnect',()=>{state.textContent='RaceCapture再接続中…';setTimeout(connect,2000)});
    }
    function showRace(){
      racePanel.hidden=false;ecoPanel.hidden=true;raceTab.classList.add('active');ecoTab.classList.remove('active');pageNav.hidden=false;
      state.textContent=rfb?._rfbConnectionState==='connected'?'RaceCapture接続済み':'RaceCapture接続中…';
    }
    function showEco(page='dashboard'){
      if(!ecoFrame.src)ecoFrame.src=ecoBase+`#${page}`;else if(new URL(ecoFrame.src).hash!==`#${page}`)ecoFrame.src=ecoBase+`#${page}`;
      racePanel.hidden=true;ecoPanel.hidden=false;raceTab.classList.remove('active');ecoTab.classList.add('active');pageNav.hidden=true;
      state.textContent=`EcoCapture / ${page}`;
    }
    function dashboardClick(x){
      showRace();
      if(!rfb||rfb._rfbConnectionState!=='connected')return;
      const key=x<512?0xff51:0xff53,code=x<512?'ArrowLeft':'ArrowRight';
      rfb.sendKey(key,code,true);setTimeout(()=>rfb?.sendKey(key,code,false),80);
    }
    raceTab.onclick=showRace;ecoTab.onclick=()=>showEco('dashboard');
    document.querySelector('#logs').onclick=()=>showEco('logs');
    document.querySelector('#settings').onclick=()=>showEco('settings');
    document.querySelector('#previous-page').onclick=()=>dashboardClick(34);
    document.querySelector('#next-page').onclick=()=>dashboardClick(990);
    document.querySelector('#fullscreen').onclick=()=>document.body.requestFullscreen();
    connect();
  </script>
</body>
</html>

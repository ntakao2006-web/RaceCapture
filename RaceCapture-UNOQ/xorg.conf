Section "Device"
    Identifier "UNOQ-Adreno"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
    Option "kmsdev" "/dev/dri/card0"
EndSection
Section "Screen"
    Identifier "RaceCapture"
    Device "UNOQ-Adreno"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1280 800
    EndSubSection
EndSection
Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "InputClass"
    Identifier "RaceCapture touchscreen"
    MatchProduct "ILITEK ILITEK Multi-Touch"
    MatchIsTouchscreen "on"
    Driver "libinput"
EndSection

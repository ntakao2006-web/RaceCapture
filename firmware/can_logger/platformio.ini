; 生CANリードオンリーロガー (実車OBD2直結用)
; 目的: 車両CANバスに一切フレームを注入せず(LISTEN_ONLY)、受信フレームを
;       マイクロ秒タイムスタンプ付きでUSBシリアルへ流し、PC側で記録する。
;       ELM327構成の弱点(UART速度ボトルネック・タイムスタンプ欠如、2-0-8)を解消する
;       Phase2-4-1「生CANロガーモード」の実装。can_selftest / usb_otg_test と同じく
;       Phase1本開発とは分離した独立プロジェクト。
;
; 安全策(3重):
;   1. TWAIを TWAI_MODE_LISTEN_ONLY で起動 … ハードが物理的にドミナントを出さない/
;      ACKを返さない/エラーフレームを出さない/再送しない。
;   2. TWAIのTX信号は未配線のダミーGPIO(GPIO10, トランシーバ非接続)へ割り当て。
;   3. トランシーバTXDへ実際に繋がるGPIO21を、単純GPIO出力HIGH(=レセッシブ)で保持。

[env:esp32-c3-can-logger]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200

; driver/twai.h(レガシTWAIドライバ)ヘッダ内 #warning が -Werror=cpp でビルドを
; 止めるため、この検証プロジェクトでは警告扱いに緩める(can_selftestと同様)。
build_flags = -Wno-error=cpp -Wno-cpp

; 現地切り分け用: 500k(既定env)で1フレームも受信できなかった場合に、
; ビットレート違いを疑って試すための追加env。回路・配線・安全策は既定envと同一で、
; TWAIのタイミング設定だけが異なる。
[env:esp32-c3-can-logger-250k]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
build_flags = -Wno-error=cpp -Wno-cpp -D CAN_BITRATE_KBPS=250

[env:esp32-c3-can-logger-125k]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
build_flags = -Wno-error=cpp -Wno-cpp -D CAN_BITRATE_KBPS=125

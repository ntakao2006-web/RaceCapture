; 生CANロガー + OBD2 PIDポーラー (実車OBD2直結用 / Phase2-2-1)
;
; 目的: can_logger と同じ生CANキャプチャを行いつつ、同じ基板から OBD2 の
;       mode 01 PIDリクエストを送信し、その応答(0x7E8)を「同じ esp_timer の
;       マイクロ秒タイムスタンプ」で同一ストリームに記録する。
;       → 2-4-5 の相関検証で、生CAN側と基準値側の時間軸が1本になり、
;         can_correlate.py の --time-offset / --auto-lag によるラグ推定が不要になる。
;
; ★ can_logger との決定的な違い ★
;   can_logger      : TWAI_MODE_LISTEN_ONLY。3重の安全策でバスへ一切送信しない。
;   can_obd_logger  : TWAI_MODE_NORMAL。**このファームは送信する**
;                     (OBD2リクエスト + 受信フレームへのACK)。
;   can_logger の「物理的に送信不能」という保証を壊さないため、モード追加ではなく
;   別プロジェクトとして分離している(can_selftest / harness_probe_nano と同じ方式)。
;
; 使い分け:
;   2-4-3 / 2-4-4 (停車操作の差分検出) … can_logger    (完全受動。7E0/7E8のノイズを混ぜない)
;   2-4-5 (相関検証) / 2-2 以降        … can_obd_logger (このプロジェクト)
;
; 配線は can_logger / can_selftest / 2-1-2 と同一:
;   GPIO21 (XIAO D6) -> MCP2562FD TXD(pin1)   … 本ファームでは実TXとして使う
;   GPIO20 (XIAO D7) <- MCP2562FD RXD(pin4)
;   MCP2562FD: VDD=5V, VIO=3.3V, VSS/STBY=GND, CANH(7)->OBD6, CANL(6)->OBD14, GND->OBD4/5
;   ※実車では卓上終端の120Ωを外すこと(車両バスは両端終端済み)。

; driver/twai.h(レガシTWAIドライバ)ヘッダ内 #warning が -Werror=cpp でビルドを
; 止めるため、この検証プロジェクトでは警告扱いに緩める(can_logger と同様)。

; ===== 実車用(既定) =====
[env:esp32-c3-can-obd-logger]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
build_flags = -Wno-error=cpp -Wno-cpp

; ===== 卓上検証専用 =====
; CAN相手のいない机上で、送信→自己受信→ログ出力の全経路を実証するためのビルド。
; TWAI_MODE_NO_ACK + メッセージselfフラグ(can_selftest と同じ手法)。
; ★このビルドは実車バスへ絶対に繋がない★ (ACKを返さないため他ノードの通信を妨害しうる)
[env:esp32-c3-can-obd-logger-bench]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
build_flags = -Wno-error=cpp -Wno-cpp -D BENCH_LOOPBACK

; MCP2562FD 配線セルフテスト用ファームウェア(使い捨て検証コード)
; 目的: 車載CANに繋ぐ前に、XIAO ESP32C3 + MCP2562FD-E/P + 120ohm(卓上終端) の
;       配線が正しいかを「TWAI自己受信モード」で確認する。
;       送信フレームが自分の受信キューに返ってくれば、
;       GPIO割当 / TXD-RXD配線 / トランシーバ / 120ohm / 500k設定 が全て正常。
; Phase1本開発(../ 直下のfirmwareプロジェクト)とは無関係の一時検証のため、
; CMakeLists.txtのソースglobが衝突しないよう別プロジェクトとして分離している。

[env:esp32-c3-can-selftest]
platform = espressif32
board = seeed_xiao_esp32c3   ; 手持ちの実機: Seeed Studio XIAO ESP32C3
framework = espidf
monitor_speed = 115200

; ESP-IDF v5.x で driver/twai.h(レガシTWAIドライバ)が deprecated 扱いになり
; ヘッダ内 #warning が -Werror=cpp でビルドを止めるため、この使い捨て検証では警告扱いに緩める。
build_flags = -Wno-error=cpp -Wno-cpp

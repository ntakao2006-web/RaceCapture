; OBDハーネス導通ライブ確認プローブ (Arduino Nano, 受動計測のみ)
; can_selftest の連続送信モードでESP32がCANバスを叩いている間、
; OBDコネクタ端の CANH/CANL を Nano の analogRead で観測し、
; 極性(6番=CANH↑ / 14番=CANL↓)と導通をライブで確認する。
; 使い捨て検証コード。firmware本開発とは無関係。

[env:nano]
platform = atmelavr
board = nanoatmega328new   ; CH340クローン。書き込み失敗時は nanoatmega328 (旧bootloader) に変更
framework = arduino
monitor_speed = 115200
upload_port = COM13
monitor_port = COM13

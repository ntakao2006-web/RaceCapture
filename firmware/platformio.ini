; RaceCapture互換ロガー ファームウェア (Phase 1: 卓上動作検証)
; 手元のESP32-C3実機で検証 → Phase 1-4でESP32-S3実機を調達し、S3向けenvを追加

[env:esp32-c3-proto]
platform = espressif32
board = seeed_xiao_esp32c3   ; 手持ちの実機: Seeed Studio XIAO ESP32C3
framework = espidf
monitor_speed = 115200
; RCP JSONプロトコルはメッセージ終端が`\r`のみ(CRLFでもLF単体でもない、HANDOFF.md参照)。
; シリアルターミナルでEnterキーを押した際に\rのみが送られるよう固定する
monitor_eol = CR
; 打った文字がその場で画面に表示されるようにする(ローカルエコー)
monitor_echo = yes

; C++専用フラグがlib/内のCファイル(minmea.c)にも誤って適用される
; PlatformIO+ESP-IDFの既知の挙動を回避 (C++側のビルドには影響なし)
build_unflags = -fuse-cxa-atexit

; 現時点で機種非依存のため導入済みライブラリ
lib_deps =
    bblanchon/ArduinoJson        ; RCP JSONプロトコルの組み立て・パース用
    ; minmea (NMEA0183パーサ) はlib/minmea/に本体2ファイルのみ直接vendoring済み
    ; (git URL指定だとexample.cが同時に取り込まれ、ESP-IDFのWerror設定でビルド失敗するため)

; IMU用ライブラリはLSM6DS3/MPU6050のどちらを採用するか未確定のため未追加
; CAN(TWAI)ドライバ、SD(FATFS)ドライバはESP-IDF本体に標準搭載のため追加ライブラリ不要

; Phase 1-4: 本番用ESP32-S3-DevKitC-1 N16R8実機向け環境。
; 1-4-2: ネイティブUSB OTGペリフェラル経由のTinyUSB CDC(専用ディスクリプタ)を
; 有効化。C3で問題になった「USB Serial/JTAGの複合ディスクリプタをスマホ版公式
; アプリが拒否する」件を解消するため、main.cpp側もS3ではUSB Serial/JTAGではなく
; TinyUSB CDC ACM API経由でRCP通信するよう分岐している(CONFIG_IDF_TARGET_ESP32S3判定)。
; TinyUSB本体(espressif/tinyusb)はComponent Manager経由(src/idf_component.yml)で取得。
; そちらのidf_component.ymlにtargets制約(esp32s2/s3/p4/h4等、C3非対応)があるため、
; C3ビルドで依存解決エラーにならないよう本体のidf_component.ymlでは
; `rules: - if: "target in [esp32s3, esp32s2, esp32p4]"`でS3系のみに限定している。
[env:esp32-s3]
platform = espressif32
; PlatformIO公式ボード定義はN8(8MB Flash/PSRAMなし)までしか無いため、
; 手持ちのN16R8(16MB Flash/8MB Octal PSRAM)に一番近いこのIDを暫定採用し、
; Flash/PSRAM設定はsdkconfig.esp32-s3側で上書きする(下記コメント参照)。
; 実機のFlash/PSRAM構成に対してこの設定が正しいかは1-4-3(実機書き込み)で要検証。
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_eol = CR
monitor_echo = yes

build_unflags = -fuse-cxa-atexit

; 1-4-2で判明：使用中のespressif32プラットフォーム(7.0.1)では
; `board_build.esp-idf.custom_sdkconfig`オプションが実装されておらず、
; ここに書いても静かに無視される(1-4-1時点ではこれに気づかず設定していたが、
; 実際には反映されていなかった)。そのため、Flash 16MB・Octal PSRAM(8MB)・
; TinyUSB CDC有効化は、自動生成される`sdkconfig.esp32-s3`ファイルを直接編集する
; 方式に変更し、そのファイルをリポジトリにコミットして管理している。
; VID/PID/文字列記述子はTinyUSB既定値のまま(実機でのスマホ側認識結果次第で1-4-4以降に要調整)。

lib_deps =
    bblanchon/ArduinoJson

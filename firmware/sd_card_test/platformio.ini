; SDカード(SDMMC 4bit)配線の動作確認用ファームウェア(使い捨て検証コード)
; 目的: 1-2-1で実配線したSDカードモジュールが、ESP-IDF公式FATFSサンプル相当の
;       処理でマウント・書き込み・読み込みできるかを確認する。
; Phase1本開発(../ 直下のfirmwareプロジェクト)は別チャットでS3のUSB OTG移行(1-4)を
; 作業中のため、CMakeLists.txtのソースglobが衝突しないよう別プロジェクトとして分離している
; (firmware/usb_otg_testと同じ考え方)。

[env:esp32-s3-sd-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; C++専用フラグがsd_test_io.c(Cファイル)にも誤って適用される
; PlatformIO+ESP-IDFの既知の挙動を回避(../platformio.iniと同じ対策)
build_unflags = -fuse-cxa-atexit

; RaceCapture USB OTGシリアル受信 動作確認用ファームウェア(使い捨て検証コード)
; 目的: スマホ版RaceCaptureアプリが、USB OTG経由でこのESP32C3をシリアルデバイスとして
;       認識し、テレメトリーを表示できるかを確認する。
; Phase1本開発(../ 直下のfirmwareプロジェクト)とは無関係の一時的な検証のため、
; CMakeLists.txtのソースglobが衝突しないよう別プロジェクトとして分離している。

[env:esp32-c3-rcp-usb-test]
platform = espressif32
board = seeed_xiao_esp32c3   ; 手持ちの実機: Seeed Studio XIAO ESP32C3
framework = espidf
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson    ; RCP JSONプロトコルの組み立て・パース用(rcp_mock_device.pyと同じ考え方)

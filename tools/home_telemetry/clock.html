<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Clock</title>
<!--
  Race clock for the pit, embedded in Grafana (2026-10-24). At Motegi the pit's phone link
  was so slow that Grafana's polled panels fell ~30 s behind, and the elapsed time with them
  (the team nearly ran out of time). This page gets only the start time and the limits from
  live_bridge.py (/ws?room=<room>&kind=clock, a few hundred bytes a second) and runs the clock
  on the browser's own time, so it keeps going while the link stalls.
  2026-10-24 night: the lap panels lagged the same way (the pit trusted a lap time ~30 s old
  and the riders finished just inside the limit), so the laps live here too: the lap being
  driven runs from its line pass on the browser's clock, and the passes come with the clock.
  Laps read "1 / 3" (the old "残り3周" on lap 1 of 3 meant laps not yet completed), and the
  margin is always shown, or a plain warning when the logger/app has sent no limit.
  The browser clock is checked against the server's: the largest (server - browser) seen
  over the last OFFSET_WINDOW_MS, since a late message can only make that difference look smaller.
  "この画面のデータ" is how old the newest data this page has is (logger -> server -> here);
  it grows when this screen stops getting updates.
  2026-10-24 night (review by ktrogt): with a one-minute window, a link that stayed ~30 s late
  for a minute was taken for clock skew, and the elapsed time and the data age read ~30 s
  small. The window is now 10 minutes (clocks drift by milliseconds in that time), it starts
  over when the browser's clock is set or the device sleeps (wall minus monotonic time jumps),
  and "回線" shows how late the newest message came compared with the fastest one in the
  window (or how long nothing has come). A link that has been slow ever since the page
  opened cannot be told from skew and still reads small.
  2026-10-25 (ER-13): the Super Cub finished 0.2 s over the limit and nothing here said it was
  heading there. "予想ゴール" is how far inside (+) or over (−) the limit the finish comes at this
  lap's average (live_bridge.py Pace.outlook), "最低" the slowest average over the rest that still
  makes it. Over the limit the page turns red (cleared only OUTLOOK_CLEAR_S back inside, so it does
  not flicker) and, when switched on, beeps every BEEP_EVERY_MS. The sound is off until someone
  presses the button (a browser plays nothing before a tap anyway).
-->
<style>
  :root { color-scheme: dark; --ink: #d8d9da; --dim: #9fa1a8; --line: #2c3235;
    --green: #73bf69; --orange: #ff9830; --red: #f2495c; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--ink);
    font: 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  /* 2026-10-25: larger text sized to the panel (vw and vh of this frame) and labels next to
     their values; the panel stays the size set on 10-24, which fits the pit's screen */
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 3px; padding: 4px 8px; box-sizing: border-box; }
  .row { display: flex; align-items: baseline; gap: 0.6em; font-variant-numeric: tabular-nums; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; font-variant-numeric: tabular-nums; }
  .cell { display: flex; align-items: baseline; gap: 0.5em; border-top: 1px solid var(--line); padding-top: 1px; }
  .label { color: var(--dim); white-space: nowrap; font-size: clamp(12px, min(2.6vw, 4.4vh), 17px); }
  #state { font-size: clamp(18px, min(5.5vw, 9vh), 36px); font-weight: 700; color: var(--dim); }
  #state.run { color: var(--green); }
  #state.goal { color: #000; background: var(--orange); border-radius: 6px; padding: 0 0.3em; }
  #laps { font-size: clamp(20px, min(6.5vw, 10vh), 44px); font-weight: 700; }
  #elapsed { font-size: clamp(26px, min(8.5vw, 13vh), 58px); font-weight: 700; }
  .big { font-size: clamp(16px, min(5vw, 7.5vh), 32px); font-weight: 600; }
  .mid { font-size: clamp(14px, min(3.6vw, 5.5vh), 22px); font-weight: 600; }
  #margin { font-size: clamp(12px, min(3vw, 4.6vh), 17px); }
  #margin.warn { color: #000; background: var(--orange); border-radius: 4px; padding: 2px 6px; }
  #passes { flex: 1; min-height: 0; overflow: auto; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: clamp(12px, min(3vw, 4.4vh), 17px); }
  th { color: var(--dim); font-weight: normal; text-align: right; position: sticky; top: 0; background: #181b1f; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 1px 0; border-bottom: 1px solid var(--line); }
  tr.goal td { color: var(--orange); font-weight: 700; }
  #fresh { font-size: 13px; }
  #fresh.stale { color: #fff; background: var(--red); border-radius: 4px; padding: 1px 6px; }
  #link { font-size: 13px; color: var(--dim); margin-left: auto; }
  #link.slow { color: #fff; background: var(--red); border-radius: 4px; padding: 1px 6px; }
  #spare { font-size: clamp(20px, min(6.5vw, 10vh), 44px); font-weight: 700; }
  #wrap.over { background: rgba(242, 73, 92, 0.18); box-shadow: inset 0 0 0 4px var(--red); }
  #overmsg { font-weight: 700; color: #fff; background: var(--red); border-radius: 4px; padding: 1px 8px; display: none;
    font-size: clamp(13px, min(3.2vw, 5vh), 20px); }
  #wrap.over #overmsg { display: inline; }
  #beep { font-size: 12px; background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
  #beep.on { color: #fff; border-color: var(--orange); }
</style>
</head>
<body>
<div id="wrap">
  <div class="row"><span id="state">接続中…</span><span id="laps"></span></div>
  <div class="row"><span class="label">経過</span><span id="elapsed">--:--</span></div>
  <div class="row"><span class="label">予想ゴール 規定まで</span><span id="spare">—</span><span id="basis" class="label"></span>
    <span class="label">最低</span><span id="minkmh" class="mid">—</span><span id="overmsg">このままだとタイムオーバー</span></div>
  <div class="pair">
    <div class="cell"><span class="label">規定まで</span><span id="limit" class="big">—</span></div>
    <div class="cell"><span class="label">目標まで</span><span id="target" class="big">—</span></div>
  </div>
  <div class="row"><span id="margin"></span></div>
  <div class="pair">
    <div class="cell"><span class="label">この周</span><span id="lapnow" class="big">—</span></div>
    <div class="cell"><span class="label">前の周</span><span id="lastlap" class="big">—</span></div>
    <div class="cell"><span class="label">この周の平均</span><span id="lapavg" class="mid">—</span></div>
    <div class="cell"><span class="label">スタートからの平均</span><span id="raceavg" class="mid">—</span></div>
  </div>
  <div id="passes"><table>
    <thead><tr><th>周</th><th>ライン</th><th>通過</th><th>ラップ</th><th>平均</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="row"><span id="fresh"></span><button id="beep" type="button">警告音：切</button><span id="link"></span></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const room = params.get('room') || 'home-test';
const STALE_S = 10;
const LINK_SLOW_S = 5;           // the bridge sends once a second
const OFFSET_WINDOW_MS = 600000; // 10 min
const KIND = { start: 'スタート', control: 'コントロール', goal: 'ゴール' };
const OUTLOOK_SAFE_S = 10;     // green from this far inside the limit (or the margin, if larger), as the app
const OUTLOOK_CLEAR_S = 2;     // back inside the limit by this much before the red goes off
const MIN_SHOWN_KMH = 60;      // a "slowest average" above this only says the time is up
const BEEP_EVERY_MS = 5000;
let over = false;
let beepOn = false;
let audio = null;
let lastBeep = 0;
let clock = null;          // live_bridge.py Pace.clock()
let offsets = [];          // [{at, d}] server minus browser time per message (ms)
let last = null;           // the newest of them
let wallMinusMono = null;  // Date.now() - performance.now() at the last message
let shownPasses = '';

function bestOffset() {
  return offsets.length ? Math.max(...offsets.map(o => o.d)) : 0;
}
function serverNow() {
  return Date.now() + bestOffset();
}
// How late this screen is getting the bridge's messages (s), or null before the first.
function linkDelay() {
  if (!last) return null;
  const late = (bestOffset() - last.d) / 1000;
  const silent = (Date.now() - last.at) / 1000 - 1;
  return Math.max(late, silent, 0);
}
function mmss(s, tenths) {
  const neg = s < 0; s = Math.abs(s);
  const m = Math.floor(s / 60), r = s - m * 60;
  const sec = tenths ? r.toFixed(1).padStart(4, '0') : String(Math.floor(r)).padStart(2, '0');
  return (neg ? '−' : '') + m + ':' + sec;
}
function hms(ms) {
  return new Date(ms).toLocaleTimeString('ja-JP', { hour12: false });
}
function kmh(v) { return v == null ? '—' : v.toFixed(1) + ' km/h'; }
function colorFor(left) {
  return left < 300 ? 'var(--red)' : left < 900 ? 'var(--orange)' : 'var(--green)';
}
function show(id, text, color) {
  const el = document.getElementById(id);
  el.textContent = text; el.style.color = color || '';
}

function drawPasses(passes) {
  const key = JSON.stringify(passes);
  if (key === shownPasses) return;
  shownPasses = key;
  const body = document.getElementById('rows');
  body.replaceChildren(...passes.slice().reverse().map(p => {
    const tr = document.createElement('tr');
    if (p.k === 'goal') tr.className = 'goal';
    for (const text of [p.n === 0 ? '—' : p.n, KIND[p.k] || p.k, hms(p.t),
                        p.s == null ? '—' : mmss(p.s, true), p.v == null ? '—' : p.v.toFixed(1)]) {
      const td = document.createElement('td');
      td.textContent = text;
      tr.appendChild(td);
    }
    return tr;
  }));
}

function beep() {
  if (!audio) return;
  const t = audio.currentTime;
  for (const at of [0, 0.25]) {   // two short tones
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.3, t + at); g.gain.setValueAtTime(0, t + at + 0.15);
    o.connect(g); g.connect(audio.destination); o.start(t + at); o.stop(t + at + 0.16);
  }
}

function drawOutlook(c, margin) {
  const o = c.outlook;
  over = o != null && (o.spare < 0 || (over && o.spare < OUTLOOK_CLEAR_S));
  document.getElementById('wrap').classList.toggle('over', over);
  show('basis', o && o.from_last ? '（前の周の平均で）' : '');
  if (o == null) {
    show('spare', '—', 'var(--dim)'); show('minkmh', '—');
  } else {
    const color = over ? 'var(--red)' : o.spare < Math.max(margin, OUTLOOK_SAFE_S) ? 'var(--orange)' : 'var(--green)';
    show('spare', (o.spare >= 0 ? '+' : '') + mmss(o.spare, true), color);
    show('minkmh', o.min_kmh != null && o.min_kmh <= MIN_SHOWN_KMH ? kmh(o.min_kmh) : '—');
  }
  // This lap's average in red under the slowest that still makes it.
  const lapavg = document.getElementById('lapavg');
  lapavg.style.color = o && o.min_kmh != null && c.lap_avg != null && c.lap_avg < o.min_kmh ? 'var(--red)' : '';
  if (over && beepOn && Date.now() - lastBeep >= BEEP_EVERY_MS) { lastBeep = Date.now(); beep(); }
}

function drawLink() {
  const el = document.getElementById('link');
  const s = linkDelay();
  if (s == null) { el.textContent = ''; el.className = ''; return; }
  el.textContent = s > LINK_SLOW_S ? `回線が${Math.round(s)}秒遅れ` : `回線 ${s.toFixed(1)}秒`;
  el.className = s > LINK_SLOW_S ? 'slow' : '';
}

function draw() {
  const now = serverNow();
  drawLink();
  if (!clock) { show('state', `${room}: データなし`); return; }
  const c = clock, limit = c.limit, margin = c.margin || 0;
  const finished = c.start != null && c.end != null;
  const elapsed = c.start == null ? null : ((finished ? c.end : now) - c.start) / 1000;
  show('state', c.start == null ? 'スタート前' : finished ? 'ゴール' : '走行中');
  document.getElementById('state').className = c.start == null ? '' : finished ? 'goal' : 'run';
  const of = c.total != null ? ` / ${c.total}` : '';
  show('laps', finished ? (c.count != null ? `${c.count}${of}` : '') : c.lap != null ? `${c.lap}${of}` : '');
  show('elapsed', elapsed == null ? '--:--' : mmss(elapsed, finished));
  const m = document.getElementById('margin');
  if (limit == null) {
    show('limit', '—'); show('target', '—');
    m.textContent = '規定時間・余裕がまだ届いていません（ドライバーのアプリで大会の設定をロック／Ver.2は記録中か確認）';
    m.className = 'warn';
  } else {
    const left = limit - (elapsed || 0);
    show('limit', mmss(left, finished), colorFor(left));
    show('target', margin > 0 ? mmss(left - margin, finished) : '—', margin > 0 ? colorFor(left - margin) : 'var(--dim)');
    m.textContent = `規定 ${mmss(limit, true)}　余裕 ${Math.round(margin)}秒` + (margin > 0 ? '（目標まで＝規定まで−余裕）' : '');
    m.className = '';
  }
  const passes = c.passes || [];
  const last = passes.length ? passes[passes.length - 1] : null;
  show('lapnow', c.lap_start != null ? mmss((now - c.lap_start) / 1000, false) : '—');
  const lastLap = last && last.s != null ? last.s : c.last_lap;
  show('lastlap', lastLap != null && lastLap > 0 ? mmss(lastLap, true) : '—');
  show('lapavg', kmh(c.lap_avg));
  show('raceavg', kmh(c.race_avg));
  drawOutlook(c, margin);
  drawPasses(passes);
  const fresh = document.getElementById('fresh');
  if (c.data_t == null) { fresh.textContent = ''; fresh.className = ''; return; }
  const age = (now - c.data_t) / 1000;
  fresh.textContent = age > STALE_S
    ? `最新のデータが${Math.round(age)}秒前のまま（時計は進み続けます）`
    : `この画面のデータ：${age.toFixed(1)}秒前`;
  fresh.className = age > STALE_S ? 'stale' : '';
}

function connect() {
  // Works direct (http://host:3002/clock) and behind the public path (/live/clock), like map.html.
  const base = location.pathname.replace(/\/clock\/?$/, '');
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${scheme}://${location.host}${base}/ws?room=${encodeURIComponent(room)}&kind=clock`);
  ws.onclose = () => { show('state', `${room}: 再接続中…`); setTimeout(connect, 2000); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (!('clock' in msg)) return;
    const at = Date.now();
    const skew = at - performance.now();
    if (wallMinusMono != null && Math.abs(skew - wallMinusMono) > 1000) offsets = [];
    wallMinusMono = skew;
    last = { at, d: msg.now - at };
    offsets.push(last);
    offsets = offsets.filter(o => at - o.at < OFFSET_WINDOW_MS);
    clock = msg.clock;
  };
}
document.getElementById('beep').onclick = () => {
  beepOn = !beepOn;
  if (beepOn && !audio) audio = new AudioContext();
  if (beepOn) { audio.resume(); beep(); }   // one beep now, so the pit hears it works
  const b = document.getElementById('beep');
  b.textContent = beepOn ? '警告音：入' : '警告音：切'; b.className = beepOn ? 'on' : '';
};
connect();
setInterval(draw, 200);
</script>
</body>
</html>

# 走行映像に焼き込む計器の設定（overlay_rec が読む）
#
# このファイル（hud_default.ini）は本体に入れておく「元の配置」（2026-10-30の配置、SUGOで使う）。
# 自分で変えるときは tools/video_hud/hud.ini を書き換える（そちらが本体にあれば、そちらを使う）。
# 書き方は tools/video_hud/hud.ini の頭に書いてある。
#
# 本体の置き場所：/opt/ecologger-video/hud_default.ini（install-video.sh が置く）
# 自分の設定の置き場所：/home/arduino/ecologger-video/hud.ini（Apply-HUD.cmd が置く。無ければこのファイルを使う）

[hud]
nodata_after = 1.5

# 下の帯
[panel]
type = box
rect = 0 860 1920 1080
color = panel

# 回転数のバー（帯の上）。8000rpmで満杯、6000で黄、7000で赤
[rpm_bar]
type = bar
rect = 40 828 1880 852
value = values.RPM
max = 8000
color = green
warn_at = 6000
alarm_at = 7000
track_color = track
tick_every = 1000
tick_color = panel
tick_width = 3

[speed_label]
type = text
x = 40
y = 870
size = 0.42
color = grey
text = SPEED km/h

[speed]
type = value
value = values.Speed|values.GPSSpeed
x = 300
y = 905
align = right
size = 1.8
color = white

[rpm_label]
type = text
x = 360
y = 870
size = 0.42
color = grey
text = RPM

[rpm]
type = value
value = values.RPM
x = 660
y = 905
align = right
size = 1.8
color = white
alarm_at = 7000

# 水温・油温（ダッシュの警告と同じしきい値。ncec-roadster track/thermal-limits.md）
[water_label]
type = text
x = 720
y = 885
size = 0.5
color = grey
text = WATER

[water]
type = value
value = values.WaterTemp
x = 1000
y = 870
align = right
size = 1
color = white
missing_color = dim
unit = C
warn_at = 100
alarm_at = 110

[oil_label]
type = text
x = 720
y = 975
size = 0.5
color = grey
text = OIL

[oil]
type = value
value = can_signals.OilTemp
x = 1000
y = 960
align = right
size = 1
color = white
missing_color = dim
unit = C
warn_at = 110
alarm_at = 120

# ラップ
[lap_no]
type = value
value = lap.CurrentLap
x = 1060
y = 870
size = 0.5
color = grey
prefix = "LAP "

[lap_time]
type = value
value = lap.ElapsedTime
format = laptime
decimals = 1
x = 1060
y = 915
size = 1.45
color = white

[last_label]
type = text
x = 1440
y = 885
size = 0.45
color = grey
text = LAST

[last]
type = value
value = lap.LapTime
format = laptime
decimals = 2
x = 1540
y = 875
size = 0.6
color = white

[best_label]
type = text
x = 1440
y = 975
size = 0.45
color = grey
text = BEST

[best]
type = value
value = lap.BestLap
format = laptime
decimals = 2
x = 1540
y = 965
size = 0.6
color = green

# Gボール（外周1.5G。横Gは右が正、前後Gは加速が下・減速が上）
[g_ball]
type = gball
center = 1815 965
radius = 72
full = 1.5
x_value = values.LatAccel
y_value = values.LongAccel
ring_color = grey
cross_color = dim
color = yellow
dot = 18
line_width = 3

# 時刻（右上、日本時間）
[clock]
type = clock
x = 1665
y = 26
size = 0.6
color = white
box = 1650 20 1900 80
box_color = panel

# 数値が来ていないとき（左上）
[no_data]
type = text
show = nodata
x = 35
y = 26
size = 0.6
color = red
text = NO DATA
box = 20 20 330 80
box_color = panel

# PCの見た目の確認（Preview-HUD.cmd）で使う仮の値。本体は読まない
[preview]
values.Speed = 128
values.RPM = 5600
values.WaterTemp = 88
can_signals.OilTemp = 96
values.LatAccel = 0.62
values.LongAccel = -0.35
lap.CurrentLap = 12
lap.ElapsedTime = 0.8455
lap.LapTime = 1.60617
lap.BestLap = 1.58083

[hud]
nodata_after = 1.5

# 下の帯
[panel]
type = box
rect = 0 860 1920 1080
color = panel

# 回転数のバー（帯の上）。8000rpmで満杯、6000で黄、7000で赤
[rpm_bar]
type = bar
rect = 40 828 1880 852
value = values.RPM
max = 8000
color = green
warn_at = 6000
alarm_at = 7000
track_color = track
tick_every = 1000
tick_color = panel
tick_width = 3

[speed_label]
type = text
x = 40
y = 870
size = 0.42
color = grey
text = SPEED km/h

[speed]
type = value
value = values.Speed|values.GPSSpeed
x = 300
y = 905
align = right
size = 1.8
color = white

[rpm_label]
type = text
x = 360
y = 870
size = 0.42
color = grey
text = RPM

[rpm]
type = value
value = values.RPM
x = 660
y = 905
align = right
size = 1.8
color = white
alarm_at = 7000

# 水温・油温（ダッシュの警告と同じしきい値。ncec-roadster track/thermal-limits.md）
[water_label]
type = text
x = 720
y = 885
size = 0.5
color = grey
text = WATER

[water]
type = value
value = values.WaterTemp
x = 1000
y = 870
align = right
size = 1
color = white
missing_color = dim
unit = C
warn_at = 100
alarm_at = 110

[oil_label]
type = text
x = 720
y = 975
size = 0.5
color = grey
text = OIL

[oil]
type = value
value = can_signals.OilTemp
x = 1000
y = 960
align = right
size = 1
color = white
missing_color = dim
unit = C
warn_at = 110
alarm_at = 120

# ラップ
[lap_no]
type = value
value = lap.CurrentLap
x = 1060
y = 870
size = 0.5
color = grey
prefix = "LAP "

[lap_time]
type = value
value = lap.ElapsedTime
format = laptime
decimals = 1
x = 1060
y = 915
size = 1.45
color = white

[last_label]
type = text
x = 1440
y = 885
size = 0.45
color = grey
text = LAST

[last]
type = value
value = lap.LapTime
format = laptime
decimals = 2
x = 1540
y = 875
size = 0.6
color = white

[best_label]
type = text
x = 1440
y = 975
size = 0.45
color = grey
text = BEST

[best]
type = value
value = lap.BestLap
format = laptime
decimals = 2
x = 1540
y = 965
size = 0.6
color = green

# Gボール（外周1.5G。横Gは右が正、前後Gは加速が下・減速が上）
[g_ball]
type = gball
center = 1815 965
radius = 72
full = 1.5
x_value = values.LatAccel
y_value = values.LongAccel
ring_color = grey
cross_color = dim
color = yellow
dot = 18
line_width = 3

# 時刻（右上、日本時間）
[clock]
type = clock
x = 1665
y = 26
size = 0.6
color = white
box = 1650 20 1900 80
box_color = panel

# 数値が来ていないとき（左上）
[no_data]
type = text
show = nodata
x = 35
y = 26
size = 0.6
color = red
text = NO DATA
box = 20 20 330 80
box_color = panel

# PCの見た目の確認（Preview-HUD.cmd）で使う仮の値。本体は読まない
[thr_bar]
type = bar
rect = 1880 300 1905 820
value = values.Throttle
max = 100
direction = up
tick_every = 25
color = green

[thr_label]
type = text
x = 1858
y = 270
size = 0.35
color = grey
text = THR

[volt_box]
type = box
rect = 20 100 420 300
color = panel

[volt]
type = value
value = values.BatteryVolt
x = 400
y = 110
align = right
size = 0.8
decimals = 1
unit = " V"
prefix = "BAT "
warn_below = 12.5
alarm_below = 11.8

[gps_spd]
type = value
value = values.GPSSpeed
x = 400
y = 170
align = right
size = 0.6
decimals = 1
prefix = "GPS "

[race]
type = value
value = lap.RaceTime
format = laptime
decimals = 1
x = 400
y = 225
align = right
size = 0.6
prefix = "RACE "

[left]
type = value
value = lap.LapsLeft
x = 1600
y = 100
size = 0.8
prefix = "LEFT "

[vert]
type = value
value = values.VertAccel
x = 1600
y = 160
size = 0.6
decimals = 2
prefix = "VG "

[alt]
type = value
value = values.Altitude
x = 1600
y = 210
size = 0.6
decimals = 0
prefix = "ALT "
unit = m

[sats]
type = value
value = values.GPSSats
x = 1600
y = 260
size = 0.6
prefix = "SAT "

[yaw]
type = value
value = values.Yaw
x = 1600
y = 310
size = 0.6
prefix = "HDG "

[dist]
type = value
value = values.Distance
x = 1600
y = 360
size = 0.6
decimals = 2
prefix = "KM "

[g2]
type = gball
center = 1700 600
radius = 110
full = 1.0

[oil_bar]
type = bar
rect = 720 1060 1000 1072
value = can_signals.OilTemp
min = 40
max = 140
warn_at = 110
alarm_at = 120
tick_every = 10

[water_bar]
type = bar
rect = 720 945 1000 957
value = values.WaterTemp
min = 40
max = 130
warn_at = 100
alarm_at = 110
tick_every = 10

[speed_bar]
type = bar
rect = 40 1060 660 1072
value = values.Speed|values.GPSSpeed
max = 200
tick_every = 20

[lap_bar]
type = bar
rect = 1060 1060 1420 1072

# 走行映像に焼き込む計器の設定（自分で変える用）
#
# ■ 使い方
#   1. このファイルを書き換えて保存する（メモ帳でよい。文字コードはUTF-8のまま）
#   2. Preview-HUD.cmd を開くと、PCのブラウザに見た目が出る（保存するたびに描き直す）
#   3. よければ Apply-HUD.cmd で本体へ送る（Pixelのテザリングで ssh unoq がつながるとき）。
#      録画中でも約1秒で、次のコマから新しい配置になる。誤りがあれば本体は前の配置のまま
#   元の配置（10/30の、下の帯に回転数のバーの配置）は tools/unoq_overlay_enc/hud_default.ini。本体へ戻すときは Apply-HUD.cmd --default
#   今のこのファイルは、RaceChronoの動画のような配置（2026-11-04）：上の帯にベスト・前の周・今の周・ベストとの差、
#   左上にコース図、下に Gメーター・速度計・回転計・スロットル・水温油温。
#   2026-11-07：回転計の色（外周の帯・数字）を車の画面（DASH）の決まりに合わせた
#   ⚠ dial・arc・map・calc.〜 などは、2026-11-04以降の録画プログラムでないと描けない（古い本体へは Apply-HUD.cmd が送らない）
#
# ■ 書き方
#   - [名前] で1つの計器が始まる。名前は自由（英数字と _）。上に書いたものから順に描き、後ろのものが上に乗る
#   - 「キー = 値」を1行に1つ。# か ; で始まる行は説明（値の後ろには書けない）
#   - 座標は1920×1080の画面で、左上が (0, 0)。右へ x、下へ y が増える（720pで録るときも、この座標のまま縮む）
#   - 文字は英数字と記号と「°」だけ（日本語は出せない。「℃」と書けば「°C」になる。°は2026-11-09より前の本体の録画プログラムでは使えない）。
#     size = 1 で1文字が幅39×高さ76ピクセル（0.5なら半分）
#   - 色は white grey dim yellow red green panel track black のどれか、#RRGGBB、#RRGGBBAA（AAは不透明度）、
#     または「赤 緑 青 不透明度」を0〜1で（例：0 0 0 0.55）。[colors] に「名前 = 色」と書けば、その名前で使える
#   - 角度（start・sweep・rotate）は度で、0が真上・時計回り
#
# ■ 計器の種類（type）と使えるキー（★は必ず書く）
#   box    塗りつぶした四角        ★rect = 左 上 右 下、color
#   text   決まった文字            ★x ★y ★text、size、color、align
#   value  数値                    ★x ★y ★value、size、color、align、decimals（小数の桁、既定0）、
#                                  prefix（前に付ける文字。空白を含むときは "LAP " のように " で囲む）、unit（後ろに付ける文字）、
#                                  scale・offset（出す値 ＝ 値×scale＋offset。単位を変えるとき）、
#                                  format = laptime（値（分）を 1:34.85 の形で出す。decimals は1か2、既定2）／
#                                           signed（正の数に + を付ける。ベストとの差など）、
#                                  warn_at・alarm_at（この値以上で warn_color（既定yellow）・alarm_color（既定red））、
#                                  warn_below・alarm_below（この値未満で同じ色）、missing_color（値が無いとき。既定は color と同じ）
#   bar    棒                      ★rect ★value ★max、min（既定0）、direction（伸びる向き right left up down、既定right）、
#                                  origin（棒の根元の値。書くと origin から値まで伸び、値が origin より小さければ逆へ伸びる。既定は min）、
#                                  color（既定green）、warn/alarm の色としきい値（value と同じ）、scale・offset、
#                                  track_color（地の色）、tick_every（目盛りの間隔。既定0で無し）、tick_color、tick_width
#   gball  Gボール                 ★center = x y ★radius、full（外周のG、既定1.5）、rings（輪の数。2なら full の半分にも輪、既定1）、
#                                  x_value・y_value（既定 values.LatAccel・values.LongAccel）、flip_x・flip_y（1で向きを逆に）、
#                                  ring_color、cross_color、color（点の色、既定yellow）、dot（点の大きさ、既定18）、line_width（既定3）
#   clock  時刻（日本時間、時:分:秒） ★x ★y、size、color、align。時刻が分からない間は出さない
#   dial   針のメーター            ★center ★radius ★value ★max、min（既定0）、scale・offset、
#                                  start（min の角度、既定-135）、sweep（min から max までの角度、既定270）、
#                                  tick_every（目盛り）、minor_every（細かい目盛り）、tick_length（既定は半径の0.12）、tick_width（既定3）、
#                                  label_every（数字を置く間隔。既定は tick_every。0で無し）、label_scale（数字に掛ける数。回転数を
#                                  1000で割るなら 0.001）、label_size（既定0.4）、decimals（数字の小数の桁）、color（目盛りと数字、既定white）、
#                                  needle_color（既定red）、needle_width（既定6）、face_color（盤の色。書かなければ盤は無し）、
#                                  ring_color と line_width（外周の線。line_width を書いたときだけ）、
#                                  warn_at・alarm_at（そこから先の外周に warn_color・alarm_color の帯）
#   arc    弧のゲージ              ★center ★radius ★value ★max、min、width（帯の太さ、既定20）、start・sweep（dial と同じ）、
#                                  color（既定green）、warn/alarm の色としきい値（value と同じ）、scale・offset、
#                                  track_color（地の色）、tick_every・tick_color・tick_width（区切り）
#   map    コース図                ★rect（この中に縦横比を保って収める）、track_color（線の色、既定white）、line_width（既定4）、
#                                  outline_color と outline_width（線の縁取り。outline_width を書いたときだけ）、
#                                  color（今の位置の点、既定red）、dot（点の大きさ、既定18）、rotate（図を時計回りに回す角度、既定0＝北が上）
#                                  線は本体が走行中に作る：ベストの周 → 最後の周 → 今の周（ここまで）の順。PCの見た目の確認では架空のコース
#   どの種類にも使える：show = always（いつも、既定）／ nodata（数値が来ていないときだけ）／ never（出さない）、
#                       box = 左 上 右 下 と box_color（その計器を出すときだけ、後ろに敷く四角。既定の色は panel）
#   align = right のときは x が文字の右端、center のときは x が文字の真ん中になる（数字の桁が変わってもそろう）
#
# ■ 値の名前（value・x_value・y_value に書く）
#   values.Speed（車速 km/h）  values.GPSSpeed（GNSSの速度 km/h）  values.RPM  values.Throttle（%）
#   values.WaterTemp（水温 ℃）  can_signals.OilTemp（油温 ℃）  values.BatteryVolt（V）
#   values.LatAccel・values.LongAccel・values.VertAccel（G）  values.Altitude（m）  values.Yaw（方位 °）
#   values.GPSSats（衛星の数）  values.Distance（km）  values.Lat・values.Lon（緯度・経度）
#   lap.CurrentLap（走行中の周）  lap.LapCount（終わった周の数）  lap.ElapsedTime（今の周の経過、分）
#   lap.LapTime（前の周、分）  lap.BestLap（ベスト、分）  lap.RaceTime（スタートからの経過、分）  lap.LapsLeft（残りの周）
#   本体の録画プログラムが計算する値（2026-11-04以降。ベストの周を走り終えてから出る）：
#     calc.Delta（ベストとの差、秒。マイナスならベストより速い）  calc.SpeedDelta（同じ場所でのベストとの速度の差、km/h）
#     calc.BestLapNo（ベストの周の番号）  calc.Predicted（予想ラップ、分）  calc.GTotal（横Gと前後Gを合わせた大きさ）
#   「|」でつなぐと、前の値が無いときに後ろを使う（例：values.Speed|values.GPSSpeed）
#   ほかの値も、本体のEcoCaptureの /api/telemetry の sample にある「区分.名前」なら使える
#
# ■ 重さ（毎秒30コマで録れるか）
#   重さは計器の数ではなく「塗る面積」で決まる。box や後ろに敷く四角（box =）、盤（face_color）、大きな文字ほど重い。
#   画面全体を1枚塗るごとに、1コマのGPUの時間が約10ms増える（持ち時間33ms）。本体で測った結果（手順書5-15）：
#     元の配置（画面0.3枚分）は余裕あり、画面1枚分の四角を足しても30コマ、2枚分を足すと27コマ、6枚分で13コマに落ちる
#     文字を上限（四角形2000個）まで詰めても19.4msで余裕あり
#   Preview-HUD.cmd の上に見積もりが出る。「重すぎる」と出る設定は Apply-HUD.cmd が送らない
#
# ■ [hud] の nodata_after：数値がこの秒数来なければ「数値が来ていない」とみなす
# ■ [preview]：PCの見た目の確認（Preview-HUD.cmd）だけで使う仮の値（本体は読まない）。「値の名前 = 数」

[hud]
nodata_after = 1.5

[colors]
face = 0 0 0 0.35
label = #B8C0CC

# ---------------------------------------------------------------- 上の帯：ベストとの速度の差・ベスト・前の周・今の周・ベストとの差
[top_band]
type = box
rect = 0 0 1920 110
color = panel

# ベストとの速度の差（同じ場所で、ベストの周より何km/h速いか。速ければ緑、遅ければ赤）
[sdelta_label]
type = text
x = 40
y = 10
size = 0.36
color = label
text = km/h vs BEST

[sdelta_bar]
type = bar
rect = 40 52 220 68
value = calc.SpeedDelta
min = -20
max = 20
origin = 0
tick_every = 10
tick_color = panel
color = green
alarm_below = 0

[sdelta]
type = value
value = calc.SpeedDelta
format = signed
x = 360
y = 30
align = right
size = 0.85
color = green
alarm_below = 0
missing_color = dim


# 走行映像に焼き込む計器の設定（自分で変える用）
#
# ■ 使い方
#   1. このファイルを書き換えて保存する（メモ帳でよい。文字コードはUTF-8のまま）
#   2. Preview-HUD.cmd を開くと、PCのブラウザに見た目が出る（保存するたびに描き直す）
#   3. よければ Apply-HUD.cmd で本体へ送る（Pixelのテザリングで ssh unoq がつながるとき）。
#      録画中でも約1秒で、次のコマから新しい配置になる。誤りがあれば本体は前の配置のまま
#   元の配置（SUGOで使ったもの）は tools/unoq_overlay_enc/hud_default.ini。本体へ戻すときは Apply-HUD.cmd --default
#
# ■ 書き方
#   - [名前] で1つの計器が始まる。名前は自由（英数字と _）。上に書いたものから順に描き、後ろのものが上に乗る
#   - 「キー = 値」を1行に1つ。# か ; で始まる行は説明（値の後ろには書けない）
#   - 座標は1920×1080の画面で、左上が (0, 0)。右へ x、下へ y が増える（720pで録るときも、この座標のまま縮む）
#   - 文字は英数字と記号だけ（日本語は出せない）。size = 1 で1文字が幅39×高さ76ピクセル（0.5なら半分）
#   - 色は white grey dim yellow red green panel track black のどれか、#RRGGBB、#RRGGBBAA（AAは不透明度）、
#     または「赤 緑 青 不透明度」を0〜1で（例：0 0 0 0.55）。[colors] に「名前 = 色」と書けば、その名前で使える
#
# ■ 計器の種類（type）と使えるキー（★は必ず書く）
#   box    塗りつぶした四角        ★rect = 左 上 右 下、color
#   text   決まった文字            ★x ★y ★text、size、color、align
#   value  数値                    ★x ★y ★value、size、color、align、decimals（小数の桁、既定0）、
#                                  prefix（前に付ける文字。空白を含むときは "LAP " のように " で囲む）、unit（後ろに付ける文字）、
#                                  scale・offset（出す値 ＝ 値×scale＋offset。単位を変えるとき）、
#                                  format = laptime（値（分）を 1:34.85 の形で出す。decimals は1か2、既定2）、
#                                  warn_at・alarm_at（この値以上で warn_color（既定yellow）・alarm_color（既定red））、
#                                  warn_below・alarm_below（この値未満で同じ色）、missing_color（値が無いとき。既定は color と同じ）
#   bar    棒                      ★rect ★value ★max、min（既定0）、direction（伸びる向き right left up down、既定right）、
#                                  color（既定green）、warn/alarm の色としきい値（value と同じ）、scale・offset、
#                                  track_color（地の色）、tick_every（目盛りの間隔。既定0で無し）、tick_color、tick_width
#   gball  Gボール                 ★center = x y ★radius、full（外周のG、既定1.5）、
#                                  x_value・y_value（既定 values.LatAccel・values.LongAccel）、flip_x・flip_y（1で向きを逆に）、
#                                  ring_color、cross_color、color（点の色、既定yellow）、dot（点の大きさ、既定18）、line_width（既定3）
#   clock  時刻（日本時間、時:分:秒） ★x ★y、size、color、align。時刻が分からない間は出さない
#   どの種類にも使える：show = always（いつも、既定）／ nodata（数値が来ていないときだけ）／ never（出さない）、
#                       box = 左 上 右 下 と box_color（その計器を出すときだけ、後ろに敷く四角。既定の色は panel）
#   align = right のときは x が文字の右端になる（数字の桁が変わっても右がそろう）
#
# ■ 値の名前（value・x_value・y_value に書く）
#   values.Speed（車速 km/h）  values.GPSSpeed（GNSSの速度 km/h）  values.RPM  values.Throttle（%）
#   values.WaterTemp（水温 ℃）  can_signals.OilTemp（油温 ℃）  values.BatteryVolt（V）
#   values.LatAccel・values.LongAccel・values.VertAccel（G）  values.Altitude（m）  values.Yaw（方位 °）
#   values.GPSSats（衛星の数）  values.Distance（km）
#   lap.CurrentLap（走行中の周）  lap.LapCount（終わった周の数）  lap.ElapsedTime（今の周の経過、分）
#   lap.LapTime（前の周、分）  lap.BestLap（ベスト、分）  lap.RaceTime（スタートからの経過、分）  lap.LapsLeft（残りの周）
#   「|」でつなぐと、前の値が無いときに後ろを使う（例：values.Speed|values.GPSSpeed）
#   ほかの値も、本体のEcoCaptureの /api/telemetry の sample にある「区分.名前」なら使える
#
# ■ 重さ（毎秒30コマで録れるか）
#   重さは計器の数ではなく「塗る面積」で決まる。box や後ろに敷く四角（box =）、大きな文字ほど重い。
#   画面全体を1枚塗るごとに、1コマのGPUの時間が約10ms増える（持ち時間33ms）。本体で測った結果（手順書5-15）：
#     元の配置（画面0.3枚分）は余裕あり、画面1枚分の四角を足しても30コマ、2枚分を足すと27コマ、6枚分で13コマに落ちる
#     文字を上限（四角形2000個）まで詰めても19.4msで余裕あり
#   Preview-HUD.cmd の上に見積もりが出る。「重すぎる」と出る設定は Apply-HUD.cmd が送らない
#
# ■ [hud] の nodata_after：数値がこの秒数来なければ「数値が来ていない」とみなす
# ■ [preview]：PCの見た目の確認（Preview-HUD.cmd）だけで使う仮の値（本体は読まない）。「値の名前 = 数」

[hud]
nodata_after = 1.5

# 下の帯
[panel]
type = box
rect = 0 860 1920 1080
color = panel

# 回転数のバー（帯の上）。8000rpmで満杯、6000で黄、7000で赤
[rpm_bar]
type = bar
rect = 40 828 1880 852
value = values.RPM
max = 8000
color = green
warn_at = 6000
alarm_at = 7000
track_color = track
tick_every = 1000
tick_color = panel
tick_width = 3

[speed_label]
type = text
x = 40
y = 870
size = 0.42
color = grey
text = SPEED km/h

[speed]
type = value
value = values.Speed|values.GPSSpeed
x = 300
y = 905
align = right
size = 1.8
color = white

[rpm_label]
type = text
x = 360
y = 870
size = 0.42
color = grey
text = RPM

[rpm]
type = value
value = values.RPM
x = 660
y = 905
align = right
size = 1.8
color = white
alarm_at = 7000

# 水温・油温（ダッシュの警告と同じしきい値。ncec-roadster track/thermal-limits.md）
[water_label]
type = text
x = 720
y = 885
size = 0.5
color = grey
text = WATER

[water]
type = value
value = values.WaterTemp
x = 1000
y = 870
align = right
size = 1
color = white
missing_color = dim
unit = C
warn_at = 100
alarm_at = 110

[oil_label]
type = text
x = 720
y = 975
size = 0.5
color = grey
text = OIL

[oil]
type = value
value = can_signals.OilTemp
x = 1000
y = 960
align = right
size = 1
color = white
missing_color = dim
unit = C
warn_at = 110
alarm_at = 120

# ラップ
[lap_no]
type = value
value = lap.CurrentLap
x = 1060
y = 870
size = 0.5
color = grey
prefix = "LAP "

[lap_time]
type = value
value = lap.ElapsedTime
format = laptime
decimals = 1
x = 1060
y = 915
size = 1.45
color = white

[last_label]
type = text
x = 1440
y = 885
size = 0.45
color = grey
text = LAST

[last]
type = value
value = lap.LapTime
format = laptime
decimals = 2
x = 1540
y = 875
size = 0.6
color = white

[best_label]
type = text
x = 1440
y = 975
size = 0.45
color = grey
text = BEST

[best]
type = value
value = lap.BestLap
format = laptime
decimals = 2
x = 1540
y = 965
size = 0.6
color = green

# Gボール（外周1.5G。横Gは右が正、前後Gは加速が下・減速が上）
[g_ball]
type = gball
center = 1815 965
radius = 72
full = 1.5
x_value = values.LatAccel
y_value = values.LongAccel
ring_color = grey
cross_color = dim
color = yellow
dot = 18
line_width = 3

# 時刻（右上、日本時間）
[clock]
type = clock
x = 1665
y = 26
size = 0.6
color = white
box = 1650 20 1900 80
box_color = panel

# 数値が来ていないとき（左上）
[no_data]
type = text
show = nodata
x = 35
y = 26
size = 0.6
color = red
text = NO DATA
box = 20 20 330 80
box_color = panel

# PCの見た目の確認（Preview-HUD.cmd）で使う仮の値。本体は読まない
[preview]
values.Speed = 128
values.RPM = 5600
values.WaterTemp = 88
can_signals.OilTemp = 96
values.LatAccel = 0.62
values.LongAccel = -0.35
lap.CurrentLap = 12
lap.ElapsedTime = 0.8455
lap.LapTime = 1.60617
lap.BestLap = 1.58083

# 「°」と「℃」の書き方（2026-11-09に足した）。°C と ℃ は同じ形になる。degree.golden は hud_dump.c で作った
[water]
type = value
value = values.WaterTemp
x = 600
y = 100
align = right
unit = °C

[oil]
type = value
value = can_signals.OilTemp
x = 600
y = 200
align = right
unit = ℃
warn_at = 110

[angle]
type = text
x = 100
y = 300
size = 0.5
text = "YAW 45°"

[yaw]
type = value
value = values.Yaw
x = 100
y = 400
prefix = "°"
unit = "° ℃"

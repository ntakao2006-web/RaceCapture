# hud_default.ini で使っていない書き方を一通り使う（本体の hud_dump と hud_layout.py の突き合わせ用）
[hud]
nodata_after = 2

[colors]
amber = #FFB000
glass = #10203080
Soft = 0.9 0.9 0.9
ok = green

[bar_left]
type = bar
rect = 100 100 500 130
value = values.Throttle
max = 100
direction = left
tick_every = 25
color = ok
warn_below = 20
alarm_below = 10
track_color = glass
tick_color = Soft

[bar_up]
type = bar
rect = 600 100 640 400
value = values.BatteryVolt
min = 10
max = 15
direction = up
tick_every = 1
tick_width = 2
warn_below = 12.5
alarm_below = 11.8
warn_color = amber

[bar_down]
type = bar
rect = 700 100 740 400
value = values.Speed
scale = 0.5
offset = 10
max = 100
direction = down
alarm_at = 80

[volt]
type = value
value = values.BatteryVolt
x = 900
y = 100
size = 0.8
decimals = 2
unit = " V"
prefix = "BAT "
warn_below = 12.5
alarm_below = 11.8
box = 880 90 1300 170
box_color = glass

[kmh_to_mph]
type = value
value = values.Speed|values.GPSSpeed
scale = 0.621371
decimals = 1
x = 1400
y = 100
align = right
color = #F0F0F0
missing_color = #FF000080

[lap_prefix]
type = value
value = lap.LapTime
format = laptime
decimals = 1
prefix = "L "
unit = s
x = 900
y = 200
size = 0.7

[hidden]
type = text
show = never
x = 0
y = 0
text = HIDDEN

[only_nodata]
type = box
show = nodata
rect = 0 0 1920 10
color = red

[g2]
type = gball
center = 300 600
radius = 100
full = 2
x_value = values.LongAccel
y_value = values.LatAccel
flip_x = 1
flip_y = 1
ring_color = amber
cross_color = 1 1 1 0.3
color = #00FFFF
dot = 10
line_width = 1.5

[clock_r]
type = clock
x = 1900
y = 1000
align = right
size = 0.5
color = Soft

[last_box]
type = box
rect = 1000.5 500.25 1100.75 600.5
color = 0.1 0.2 0.3 0.4

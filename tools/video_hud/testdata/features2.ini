# 2026-11-04に足した書き方（dial・arc・map・origin・signed・rings・center・calc.〜）を一通り使う（本体の hud_dump と hud_layout.py の突き合わせ用）
[colors]
face = 0 0 0 0.35

[dial_full]
type = dial
center = 300 300
radius = 150
value = values.RPM
min = 1000
max = 9000
start = -140
sweep = 280
tick_every = 1000
minor_every = 250
tick_length = 22
tick_width = 4
label_every = 2000
label_scale = 0.001
label_size = 0.35
decimals = 1
color = #E0E0E0
needle_color = yellow
needle_width = 5
face_color = face
ring_color = grey
line_width = 3
warn_at = 6500
alarm_at = 7500
warn_color = #FFA000
alarm_color = red

[dial_plain]
type = dial
center = 700 300
radius = 120
value = values.Speed
scale = 0.621371
max = 160
tick_every = 20

[arc_neg]
type = arc
center = 1100 300
radius = 100
width = 24
value = values.Throttle
max = 100
start = 120
sweep = -240
color = green
warn_at = 80
alarm_at = 95
track_color = #20202080
tick_every = 25
tick_color = white
tick_width = 2

[arc_below]
type = arc
center = 1450 300
radius = 90
value = values.BatteryVolt
min = 10
max = 15
warn_below = 12.5
alarm_below = 11.8

[map_a]
type = map
rect = 100 600 500 900
track_color = white
line_width = 5
outline_color = 0 0 0 0.7
outline_width = 2
color = #FF3030
dot = 20
rotate = 30

[map_b]
type = map
rect = 600 600 700 1000

[bar_origin_r]
type = bar
rect = 900 600 1200 620
value = calc.Delta
min = -2
max = 2
origin = 0
color = green
alarm_at = 0.005

[bar_origin_l]
type = bar
rect = 900 640 1200 660
value = calc.Delta
min = -2
max = 2
origin = 0
direction = left
tick_every = 1

[bar_origin_u]
type = bar
rect = 1250 600 1270 800
value = calc.SpeedDelta
min = -20
max = 20
origin = 0
direction = up

[bar_origin_d]
type = bar
rect = 1300 600 1320 800
value = calc.SpeedDelta
min = -20
max = 20
origin = 5
direction = down

[delta]
type = value
value = calc.Delta
format = signed
decimals = 2
x = 1500
y = 600
align = center
size = 0.8
color = green
alarm_at = 0.005

[g2]
type = gball
center = 1700 850
radius = 100
full = 2
rings = 3
color = red

[g_total]
type = value
value = calc.GTotal|values.LatAccel
decimals = 2
x = 1700
y = 970
align = center
prefix = "G "

[pred]
type = value
value = calc.Predicted
format = laptime
x = 1900
y = 1000
align = right
size = 0.5

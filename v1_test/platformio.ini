[env:logger-v1-board-test]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_eol = CR

build_unflags = -fuse-cxa-atexit

lib_deps =
    bblanchon/ArduinoJson

; M5Stack A105 is connected to the logger's UART0/EN/GPIO0 header.
; upload_port and monitor_port are intentionally auto-detected.

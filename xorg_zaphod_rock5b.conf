# ROCK 5B dashcam: single Xorg process with two independent screens via
# Zaphod mode, so race_capture's "1 process = 1 window" limitation doesn't
# force two separate DRM masters onto the same GPU (that setup produced
# EBUSY / "Could not queue pageflip" on both FB-mode and plain dual-Xorg
# attempts - verified in practice, see task_dashcam_breakdown.md DC-9-1-b).
#
# HDMI-1 -> :0.0 (driving-display dash), HDMI-2 -> :0.1 (streaming dash).
# ZaphodHeads must use Xorg's internal output name ("HDMI-1"), not the DRM
# sysfs name ("HDMI-A-1") - using the sysfs name silently fails to bind.
# Each Device needs an explicit "Screen N": without it Xorg treats the
# second Device as a duplicate of the first and drops it.

Section "ServerLayout"
    Identifier "ZaphodLayout"
    Screen 0 "Screen0" 0 0
    Screen 1 "Screen1" RightOf "Screen0"
EndSection

Section "Device"
    Identifier "Card0Screen0"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "ZaphodHeads" "HDMI-1"
    Screen 0
EndSection

Section "Device"
    Identifier "Card0Screen1"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "ZaphodHeads" "HDMI-2"
    Screen 1
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0Screen0"
EndSection

Section "Screen"
    Identifier "Screen1"
    Device "Card0Screen1"
EndSection

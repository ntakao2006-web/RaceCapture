# ROCK 5B dashcam: single Xorg process with two independent screens via
# Zaphod mode, so race_capture's "1 process = 1 window" limitation doesn't
# force two separate DRM masters onto the same GPU (that setup produced
# EBUSY / "Could not queue pageflip" on both FB-mode and plain dual-Xorg
# attempts - verified in practice, see task_dashcam_breakdown.md DC-9-1-b).
#
# HDMI-1 -> :0.0 (driving-display dash), HDMI-2 -> :0.1 (streaming dash).
# ZaphodHeads must use Xorg's internal output name ("HDMI-1"), not the DRM
# sysfs name ("HDMI-A-1") - using the sysfs name silently fails to bind.
# Each Device needs an explicit "Screen N": without it Xorg treats the
# second Device as a duplicate of the first and drops it.

Section "ServerLayout"
    Identifier "ZaphodLayout"
    Screen 0 "Screen0" 0 0
    Screen 1 "Screen1" RightOf "Screen0"
EndSection

Section "Device"
    Identifier "Card0Screen0"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "ZaphodHeads" "HDMI-1"
    Screen 0
EndSection

Section "Device"
    Identifier "Card0Screen1"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "ZaphodHeads" "HDMI-2"
    Screen 1
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0Screen0"
EndSection

Section "Screen"
    Identifier "Screen1"
    Device "Card0Screen1"
    # The streaming dash is recorded and streamed, so its resolution has to be a
    # fixed, known quantity rather than whatever happens to be plugged in. In the
    # car nothing is plugged into HDMI-2 at all: an EDID dummy plug keeps the
    # connector alive so the Zaphod screen still exists and can be captured. The
    # dummy in use (BBC HDP-V104) advertises 4096x2160 and 3840x2160 ahead of
    # 1920x1080, and following that would render the dash and run the RKMPP
    # encoder at 4K - roughly 4x the GPU load - while -b:v 4M keeps the output
    # bitrate the same, so the picture would get worse, not better. Pin 1080p.
    #
    # Screen0 (the driving display) is deliberately NOT pinned: it follows the
    # native resolution of whatever panel is fitted in the car.
    SubSection "Display"
        Modes "1920x1080"
    EndSubSection
EndSection
